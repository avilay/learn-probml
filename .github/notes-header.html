<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,400italic,700,700italic&subset=latin,latin-ext">
<style>
  html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: "Open Sans", "Clear Sans", "Helvetica Neue", Helvetica, Arial, "Segoe UI Emoji", "SF Pro", sans-serif;
    color: rgb(51, 51, 51);
    line-height: 1.6;
    max-width: 860px;
    margin: 0 auto;
    padding: 30px;
    padding-bottom: 100px;
  }

  @media only screen and (min-width: 1400px) {
    body { max-width: 1024px; }
  }
  @media only screen and (min-width: 1800px) {
    body { max-width: 1200px; }
  }

  a {
    color: #4183C4;
  }

  h1, h2, h3, h4, h5, h6 {
    margin-top: 1rem;
    margin-bottom: 1rem;
    font-weight: bold;
    line-height: 1.4;
  }
  h1 {
    font-size: 2.25em;
    line-height: 1.2;
    border-bottom: 1px solid #eee;
  }
  h2 {
    font-size: 1.75em;
    line-height: 1.225;
    border-bottom: 1px solid #eee;
  }
  h3 {
    font-size: 1.5em;
    line-height: 1.43;
  }
  h4 {
    font-size: 1.25em;
  }
  h5 {
    font-size: 1em;
  }
  h6 {
    font-size: 1em;
    color: #777;
  }

  p, blockquote, ul, ol, dl, table {
    margin: 0.8em 0;
  }
  li > ol, li > ul {
    margin: 0 0;
  }

  hr {
    height: 2px;
    padding: 0;
    margin: 16px 0;
    background-color: #e7e7e7;
    border: 0 none;
    overflow: hidden;
    box-sizing: content-box;
  }

  ul, ol {
    padding-left: 30px;
  }
  ul:first-child, ol:first-child {
    margin-top: 0;
  }
  ul:last-child, ol:last-child {
    margin-bottom: 0;
  }

  blockquote {
    border-left: 4px solid #dfe2e5;
    padding: 0 15px;
    color: #777777;
  }
  blockquote blockquote {
    padding-right: 0;
  }

  table {
    border-collapse: collapse;
    padding: 0;
    word-break: normal;
    width: 100%;
  }
  table tr {
    border: 1px solid #dfe2e5;
    margin: 0;
    padding: 0;
  }
  table tr:nth-child(2n),
  thead {
    background-color: #f8f8f8;
  }
  table th {
    font-weight: bold;
    border: 1px solid #dfe2e5;
    border-bottom: 0;
    margin: 0;
    padding: 6px 13px;
  }
  table td {
    border: 1px solid #dfe2e5;
    margin: 0;
    padding: 6px 13px;
  }

  code, tt {
    border: 1px solid #e7eaed;
    background-color: #f3f4f4;
    border-radius: 3px;
    padding: 2px 4px;
    font-size: 0.9em;
  }

  pre {
    margin-top: 15px;
    margin-bottom: 15px;
    padding: 8px 12px 6px;
    background-color: #f8f8f8;
    border-radius: 3px;
    overflow-x: auto;
  }
  pre code, pre tt {
    border: 0;
    background: none;
    padding: 0;
    font-size: 0.9em;
  }

  img {
    max-width: 100%;
  }
</style>
