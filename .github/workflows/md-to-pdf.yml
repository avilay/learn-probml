name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'md/**.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          curl -sLO https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc-3.10.1-1-amd64.deb
          rm pandoc-3.10.1-1-amd64.deb

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            lmodern \
            fonts-dejavu-core

      - name: Convert Markdown files to PDF
        run: |
          mkdir -p pdfs
          for file in md/*.md; do
            name=$(basename "$file" .md)
            pandoc "$file" \
              -o "pdfs/${name}.pdf" \
              --pdf-engine=xelatex \
              -V geometry:margin=1in \
              -V mainfont="DejaVu Serif" \
              -V monofont="DejaVu Sans Mono"
          done

      - name: Commit and push generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdfs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate PDFs from markdown"
            git push
          fi
